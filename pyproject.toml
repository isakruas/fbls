[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tess-gpu-search"
version = "0.4.0"
description = "FBLS: multi-pass fused box least squares transit search on the GPU, with a TESS survey layer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Isak Paulo de Andrade Ruas, NROLABS"}]
dependencies = ["numpy>=1.26,<3", "torch==2.7.1", "triton==3.3.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
targets = ["astropy>=6,<9", "lightkurve>=2.5,<3"]
survey = ["scipy>=1.13,<2", "astropy>=6,<9", "lightkurve>=2.5,<3", "triceratops==1.1.0"]
dev = ["pyflakes>=3"]

[project.scripts]
tess-search = "tess_search.cli:main"
tess-survey = "tess_survey.run:main"

[tool.setuptools]
packages = ["tess_search", "tess_survey"]
include-package-data = false

