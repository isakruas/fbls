# Tag v<day>: GitHub release with the files of paper/deposit/<day>/ as its only assets and the
# ReadMe as its notes. Zenodo's GitHub integration turns each release into a version of the record.
name: Catalog release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ github.ref_name }}
        run: |
          folder="paper/deposit/${DAY#v}"
          [ -d "$folder" ] || { echo "::error::$folder is not in the repository"; exit 1; }
          gh release create "$DAY" "$folder"/* --title "FBLS: Preliminary Catalog of Exoplanet Transit Candidates Identified in TESS Photometry (${DAY#v})" --notes-file "$folder/ReadMe.txt"
