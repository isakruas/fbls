# A tag v<day> publishes paper/deposit/<day>/ as a GitHub release (its four files as assets) and as a
# new version of the Zenodo record. Secrets: ZENODO_TOKEN (deposit:write, deposit:actions).
# Variable: ZENODO_RECORD, the concept record id, empty for the first release (the run prints it).
name: Catalog release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DAY: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with the deposit files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          folder="paper/deposit/${DAY#v}"
          gh release create "$DAY" "$folder"/* --title "Catalog ${DAY#v}" --notes-file "$folder/ReadMe.txt"
      - name: Zenodo version
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_RECORD: ${{ vars.ZENODO_RECORD }}
        run: python paper/zenodo_upload.py "paper/deposit/${DAY#v}"
